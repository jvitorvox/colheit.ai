<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>colheit.ai</title>
<meta name="description" content="Seus pedidos, suas notas e sua lavoura — de todas as revendas, num acesso só.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14692A">
<link rel="apple-touch-icon" href="/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="colheit.ai">
<link rel="stylesheet" href="/base.css">
<style>
/* Só o que é do portal. Tokens e primitivas vivem em base.css. */
body{padding:0 0 calc(74px + env(safe-area-inset-bottom))}
#app{max-width:680px;margin:0 auto;padding:16px 14px 0}

.topo{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.topo h2{font-size:1.3rem}
.voltar{width:38px;height:38px;flex:none;border:1px solid var(--linha);background:var(--papel);
  border-radius:11px;font-size:18px;color:var(--tinta-2)}

.pedido{cursor:pointer}
.pedido:active{transform:scale(.995)}
.linha.hist{font-size:.875rem;color:var(--tinta-2)}
.linha.hist.voltou span:first-child{color:var(--alerta)}
.nota-linha{font-size:.875rem;color:var(--tinta-2);margin-top:6px}

.entrada{max-width:380px;margin:12vh auto 0;text-align:center}
.marca{font-size:1.75rem;color:var(--marca)}
.entrada .sub{margin:8px 0 22px;font-size:.9375rem;color:var(--tinta-2)}
.entrada form{text-align:left}
.entrada .botao{width:100%;margin-top:12px;padding:13px;font-size:1rem}

.abas{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--papel);
  border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom);z-index:5}
/* Cinco abas em 375px dão 75px cada. O nome não pode quebrar em duas linhas nem
   sumir com reticências, então a fonte cede antes do espaço. */
.abas button{flex:1;min-width:0;border:none;background:none;padding:15px 2px;
  font-size:.8125rem;color:var(--tinta-3);white-space:nowrap}
.abas button.ativa{color:var(--marca);font-weight:600}

/* Um plantio dentro do cartão da safra. A régua à esquerda liga as linhas do
   mesmo talhão sem precisar de mais um cartão dentro do cartão. */
/* O número do ano. É o que ele abre a tela para ver. */
.num.grande.resultado{font-size:2.25rem;line-height:1.1;letter-spacing:-.02em;
  color:var(--marca);margin:8px 0 2px}
.variacao{font-size:.875rem;font-weight:600;padding-bottom:6px}
.variacao.sobe{color:var(--marca)}
.variacao.desce{color:var(--alerta)}

/* Talhão a talhão, do melhor ao pior. Mesma gramática do funil do console. */
.faixa-talhao{display:grid;grid-template-columns:1fr auto;gap:3px 10px;
  grid-template-areas:"nome num" "medidor medidor";align-items:center;
  font-size:.875rem;padding:6px 0}
.faixa-talhao>span:first-child{grid-area:nome}
.faixa-talhao>span:last-child{grid-area:num;font-weight:600}
.faixa-talhao>.medidor{grid-area:medidor;height:9px;background:var(--papel-2);
  border:1px solid var(--linha);border-radius:5px;overflow:hidden}
.faixa-talhao .medidor i{display:block;height:100%;background:var(--marca-2)}

/* Item da lista de preparo: o alvo é a linha inteira, não a caixinha — no
   celular, com a mão suja, ninguém acerta 16px. */
.preparo-item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;
  border-top:1px solid var(--linha);font-size:.9375rem;cursor:pointer}
.preparo-item input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--marca)}
.preparo-item input:checked+span{color:var(--tinta-3);text-decoration:line-through}

.plantio{border-left:2px solid var(--linha);padding-left:11px;margin:9px 0 2px}
.plantio+.plantio{margin-top:14px}
.linha.colhido{border-top:1px dashed var(--linha);margin-top:5px}
.linha.colhido .num.grande{color:var(--marca)}

#sem-rede{position:sticky;top:0;z-index:4;background:var(--sol-suave);
  border-bottom:1px solid var(--sol);color:var(--sol-tinta);
  font-size:.8125rem;text-align:center;padding:7px 12px}
#sem-rede[hidden]{display:none}
</style>
</head>
<body>
<div id="sem-rede" hidden>Sem conexão — mostrando o que já tinha aqui.</div>
<main id="app"></main>
<div id="rodape"></div>
<script src="/app.js"></script>
</body>
</html>
