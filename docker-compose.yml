services:

  # --- Banco (PostgreSQL) ---
  db:
    image: postgres:16-alpine
    container_name: colheitai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - colheitai-dados:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [colheitai-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Armazém de objetos (MinIO) ---
  #
  # Sobe sempre, junto com o banco, porque é o caminho que produção usa: um
  # backend exercitado só em produção é um backend não testado. O adaptador de
  # disco continua existindo para quem não quiser subir nada, e o teste roda
  # nos dois.
  armazem:
    image: minio/minio:latest
    container_name: colheitai-armazem
    restart: unless-stopped
    command: server /dados --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_CHAVE}
      MINIO_ROOT_PASSWORD: ${S3_SEGREDO}
    volumes:
      - colheitai-midia:/dados
    networks: [colheitai-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- API (Node) ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: colheitai-api
    restart: unless-stopped
    environment:
      PGHOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      API_PORT: 3000
      JWT_SEGREDO: ${JWT_SEGREDO}
      AUTH_EXPOR_CODIGO: ${AUTH_EXPOR_CODIGO}
      VAPID_PUBLICA: ${VAPID_PUBLICA}
      VAPID_PRIVADA: ${VAPID_PRIVADA}
      VAPID_CONTATO: ${VAPID_CONTATO}
      GATEWAY_SEGREDO: ${GATEWAY_SEGREDO}
      ARMAZEM: ${ARMAZEM}
      S3_ENDPOINT: http://armazem:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_CHAVE: ${S3_CHAVE}
      S3_SEGREDO: ${S3_SEGREDO}
      MIDIA_DIR: /dados/midia
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./api/src:/app/api/src:ro
      - ./api/package.json:/app/api/package.json:ro
      - ./db:/app/db:ro
      - ./test:/app/test:ro
      - ./web:/app/web:ro
      - ./gateway/src:/app/gateway/src:ro
      - colheitai-midia-disco:/dados/midia
    depends_on:
      db:
        condition: service_healthy
      armazem:
        condition: service_healthy
    networks: [colheitai-net]

  # --- Gateway do WhatsApp (Baileys) ---
  #
  # Processo separado de propósito: bloqueio ou travamento aqui não derruba a
  # API. Sobe sob demanda — `docker compose --profile whatsapp up` — porque
  # exige parear um número lendo o QR no log, e ninguém quer isso a cada
  # `compose up` de desenvolvimento.
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: colheitai-gateway
    profiles: [whatsapp]
    restart: unless-stopped
    environment:
      API_BASE: http://api:3000
      GATEWAY_SEGREDO: ${GATEWAY_SEGREDO}
      SESSOES_DIR: /dados/sessoes
    volumes:
      - colheitai-whatsapp:/dados
      - ./gateway/src:/app/gateway/src:ro
    depends_on: [api]
    networks: [colheitai-net]
    stdin_open: true
    tty: true

networks:
  colheitai-net:

volumes:
  colheitai-dados:
  # Sessão pareada do WhatsApp. Perder este volume significa parear os números
  # de novo. Mídia não mora mais aqui: o gateway não guarda arquivo.
  colheitai-whatsapp:
  # Os objetos do MinIO.
  colheitai-midia:
  # Mídia do adaptador de disco, para quem rodar com ARMAZEM=disco.
  colheitai-midia-disco:
