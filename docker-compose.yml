services:

  # --- Banco (PostgreSQL) ---
  db:
    image: postgres:16-alpine
    container_name: colheitai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - colheitai-dados:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [colheitai-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- API (Node) ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: colheitai-api
    restart: unless-stopped
    environment:
      PGHOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      API_PORT: 3000
      JWT_SEGREDO: ${JWT_SEGREDO}
      AUTH_EXPOR_CODIGO: ${AUTH_EXPOR_CODIGO}
      VAPID_PUBLICA: ${VAPID_PUBLICA}
      VAPID_PRIVADA: ${VAPID_PRIVADA}
      VAPID_CONTATO: ${VAPID_CONTATO}
      GATEWAY_SEGREDO: ${GATEWAY_SEGREDO}
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./api/src:/app/api/src:ro
      - ./api/package.json:/app/api/package.json:ro
      - ./db:/app/db:ro
      - ./test:/app/test:ro
      - ./web:/app/web:ro
      - ./gateway/src:/app/gateway/src:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [colheitai-net]

  # --- Gateway do WhatsApp (Baileys) ---
  #
  # Processo separado de propósito: bloqueio ou travamento aqui não derruba a
  # API. Sobe sob demanda — `docker compose --profile whatsapp up` — porque
  # exige parear um número lendo o QR no log, e ninguém quer isso a cada
  # `compose up` de desenvolvimento.
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: colheitai-gateway
    profiles: [whatsapp]
    restart: unless-stopped
    environment:
      API_BASE: http://api:3000
      GATEWAY_SEGREDO: ${GATEWAY_SEGREDO}
      SESSOES_DIR: /dados/sessoes
      MIDIA_DIR: /dados/midia
    volumes:
      - colheitai-whatsapp:/dados
      - ./gateway/src:/app/gateway/src:ro
    depends_on: [api]
    networks: [colheitai-net]
    stdin_open: true
    tty: true

networks:
  colheitai-net:

volumes:
  colheitai-dados:
  # Sessão pareada do WhatsApp e mídia recebida. Perder este volume significa
  # parear os números de novo.
  colheitai-whatsapp:
